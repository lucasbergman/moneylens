// Protocol Buffer definitions for Moneylens transaction interchange format.
// This format is used for importing and exporting financial transaction data
// between Moneydance and automation tools.

syntax = "proto3";

package house.bergman.moneylens;

option java_package = "house.bergman.moneylens.proto";
option java_multiple_files = true;

// Represents an export from Moneydance with account and transaction data.
// This provides the necessary context for an AI to understand the existing ledger.
message TransactionExport {
    // Recent transactions from the exported account(s).
    repeated Transaction transactions = 1;

    // Metadata about accounts and categories involved in the transactions.
    repeated AccountInfo accounts = 2;
}

// Represents a list of transactions to be imported into Moneydance.
message TransactionImport {
    // The new transactions to be recorded.
    repeated Transaction transactions = 1;
}

// Metadata about a Moneydance account or category.
message AccountInfo {
    // The unique identifier for the account (UUID).
    string id = 1;

    // The human-readable name of the account (e.g., "Groceries").
    string name = 2;

    // The full hierarchical name of the account (e.g., "Expenses:Food:Groceries").
    string full_name = 3;

    enum AccountType {
        ACCOUNT_TYPE_UNSPECIFIED = 0;
        ACCOUNT_TYPE_ROOT = 1;
        ACCOUNT_TYPE_BANK = 2;
        ACCOUNT_TYPE_CHECKING = 3;
        ACCOUNT_TYPE_SAVINGS = 4;
        ACCOUNT_TYPE_CREDIT_CARD = 5;
        ACCOUNT_TYPE_INVESTMENT = 6;
        ACCOUNT_TYPE_SECURITY = 7;
        ACCOUNT_TYPE_ASSET = 8;
        ACCOUNT_TYPE_LIABILITY = 9;
        ACCOUNT_TYPE_LOAN = 10;
        ACCOUNT_TYPE_EXPENSE = 11;
        ACCOUNT_TYPE_INCOME = 12;
    }
    // The type of account.
    AccountType type = 4;

    // The ISO 4217 currency code (e.g., "USD").
    string currency_code = 5;

    // The UUID of the parent account, if any.
    string parent_id = 6;
}

// Represents a single financial transaction context (ParentTxn in Moneydance).
message Transaction {
    // Transaction date in YYYY-MM-DD format. Maps to ParentTxn.setDateInt().
    string date = 1;

    // Optional tax date in YYYY-MM-DD format, if different from transaction date.
    string tax_date = 2;

    // Payee or description of the transaction.
    string description = 3;

    // The primary account UUID associated with this transaction.
    string account_id = 4;

    // The net amount affecting the primary 'account' in cents.
    // Negative for expenses, positive for deposits.
    int64 amount = 5;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        // Maps to AbstractTxn.STATUS_CLEARED
        STATUS_CLEARED = 1;
        // Maps to AbstractTxn.STATUS_RECONCILING
        STATUS_RECONCILING = 2;
        // Maps to AbstractTxn.STATUS_UNRECONCILED
        STATUS_UNRECONCILED = 3;
    }
    // The clearing status.
    Status status = 6;

    // Additional notes or memo for the transaction
    string memo = 7;

    // Check number, if applicable.
    string check_number = 8;

    // List of keywords or tags associated with the transaction.
    repeated string tags = 9;

    // List of file paths or URIs to attachment files (images, PDFs) associated
    // with this transaction.
    repeated string attachments = 10;

    // The contra-account or category UUID for a simple single-split transaction.
    // If 'splits' is provided, this field should be ignored.
    string category_id = 11;

    // For complex transactions. Defines the SplitTxn objects added to the
    // ParentTxn.
    repeated Split splits = 12;
}

// For complex transactions. Defines the SplitTxn objects added to the
// ParentTxn.
message Split {
    // The account/category UUID for this split.
    string category_id = 1;

    // The amount for this split in cents. Signs should strictly follow double-entry
    // logic relative to the main amount.
    int64 amount = 2;

    // Memo specific to this split.
    string memo = 3;

    // Tags specific to this split.
    repeated string tags = 4;
}
